pull_request_rules: []
merge_protections:
  - name: VM6 Deployment Easy
    if:
      - head = deployment-easy
    success_conditions:
      - base = main
  - name: VM6 Deployment Strict
    if:
      - head = deployment-strict
    success_conditions:
      - label = vm6-deployment-required
merge_protections_settings:
  reporting_method: deployments
  post_comment: true

merge_queue:
  mode: serial
  max_parallel_checks: 1

queue_rules:
  - name: vm6-app-selection-batch-timer-261001
    batch_size: 2
    batch_max_wait_time: 1 minute
    queue_conditions:
      - title ~= ^VM6_APPSEL_TIMER_(POSITIVE|TREATMENT)_261001$
    merge_conditions:
      - check-success = vm6-appsel-never-pass-261001
    merge_method: merge
    checks_timeout: null
