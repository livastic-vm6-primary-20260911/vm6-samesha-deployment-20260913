name: VM6 Schedule Window Delay
on:
  pull_request:

jobs:
  vm6-schedule-window-delay:
    if: startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: ubuntu-latest
    steps:
      - name: Cross schedule boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'holding speculative draft past the allowed merge schedule'
          sleep 300
          echo 'delay completed'
